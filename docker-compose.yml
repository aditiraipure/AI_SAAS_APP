services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: quickai-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
    networks:
      - quickai-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_bmVlZGVkLWNhbWVsLTIwMDEuY2xlcmsuYWNjb3VudHMuZGV2JA}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:5000}
        VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:5000}
    container_name: quickai-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - quickai-network

networks:
  quickai-network:
    driver: bridge
